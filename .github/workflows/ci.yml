# Runs on every pull request and push to main. Enable "Require status checks"
# in branch protection so merges are blocked until this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (dev + serve)
        run: uv sync --group dev --extra serve --python ${{ matrix.python-version }}

      - name: Unit tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -m "not integration" -v --tb=short

      - name: Integration tests
        env:
          ANTHROPIC_API_KEY: sk-ant-api03-ci-placeholder-not-used-for-real-llm-calls
        run: uv run --python ${{ matrix.python-version }} pytest tests/integration -m integration -v --tb=short
